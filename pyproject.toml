[project]
name = "sitelens"
version = "0.1.0"
description = "Traffic, order conversion, and GEO answer monitoring for independent websites."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SiteLens contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/lzq-0529/sitelens"
Repository = "https://github.com/lzq-0529/sitelens"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sitelens*"]

[tool.setuptools.package-data]
sitelens = ["static/tracker.js"]
