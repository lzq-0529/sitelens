services:
  sitelens:
    build: .
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      SITELENS_ENV: production
      SITELENS_DATA_DIR: /data
      SITELENS_HOST: 0.0.0.0
      SITELENS_PORT: "8788"
      SITELENS_COOKIE_SECURE: ${SITELENS_COOKIE_SECURE:-0}
      SITELENS_SECRET_KEY: ${SITELENS_SECRET_KEY:-}
      SITELENS_COLLECT_TOKEN: ${SITELENS_COLLECT_TOKEN:-}
      SITELENS_GEO_TOKEN: ${SITELENS_GEO_TOKEN:-}
      SITELENS_CRON_TOKEN: ${SITELENS_CRON_TOKEN:-}
      SITELENS_CORS_ORIGINS: ${SITELENS_CORS_ORIGINS:-}
    volumes:
      - sitelens-data:/data

  tick:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - sitelens
    environment:
      SITELENS_CRON_TOKEN: ${SITELENS_CRON_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -X POST http://sitelens:8788/api/cron/tick -H "x-cron-token: $$SITELENS_CRON_TOKEN" || true
          sleep 3600
        done

volumes:
  sitelens-data:
